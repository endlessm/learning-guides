:root{

.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.herobox{padding-block:20px 44px}
.herotop{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ealogo{height:30px;width:auto;display:block}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:999px;overflow:hidden;background:rgba(14,12,20,.7)}
.lang button{border:0;background:transparent;color:#C9C7D8;font-family:var(--display);font-weight:600;font-size:13px;padding:6px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#FF6B00;color:#fff}
.herotext{max-width:62ch;margin-top:40px}
.kicker{display:inline-block;font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:#FFB27A}
.hero h1{font-family:var(--display);font-size:clamp(30px,5vw,48px);line-height:1.05;margin:8px 0 0;font-weight:800;letter-spacing:-.02em;text-wrap:balance;color:#fff}
.hero .lead{color:#E2E0EE;margin:12px 0 0;max-width:54ch;font-size:16px}

/* ---------- Search + A–Z ---------- */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.toolbar .wrap{padding-block:14px 12px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 260px;min-width:0;position:relative}
#q{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:10px;padding:10px 12px 10px 40px}
#q:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.count{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.letters{display:flex;flex-wrap:wrap;gap:4px}
.letters a,.letters span{font-family:var(--display);font-size:13px;font-weight:700;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;text-decoration:none}
.letters a{color:var(--accent-ink);background:var(--accent-soft)}
.letters a:hover{background:var(--accent);color:#fff}
.letters span{color:var(--faint)}

/* ---------- Entries ---------- */
main{padding-block:4px 64px}
section.group{display:grid;grid-template-columns:72px 1fr;gap:0 24px;padding-top:32px;scroll-margin-top:130px}
.group h2{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;margin:0;color:var(--accent);position:sticky;top:150px;align-self:start}
dl{margin:0;min-width:0;border-top:2px solid var(--ink)}
.entry{padding:16px 0 18px;border-bottom:1px solid var(--line)}
dt{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.3}
dt .alt{font-family:var(--body);font-weight:400;font-size:14.5px;color:var(--muted);margin-left:6px}
dd{margin:6px 0 0;max-width:68ch;color:var(--ink)}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--accent)}
.empty{padding:48px 0;color:var(--muted)}
.empty strong{color:var(--ink)}

@media (max-width:620px){
  .hero{background-position:35% center}
  .herotext{margin-top:28px}
  section.group{grid-template-columns:1fr;scroll-margin-top:170px}
  .group h2{position:static;font-size:34px;margin-bottom:8px}
  .letters a,.letters span{width:26px;height:26px;font-size:12px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>

const EN = `Abilities||The actions or powers a character can use in a game, such as jumping, dashing, or casting a spell. Abilities often define the player’s options and can grow or change through skill trees or upgrades.
Aesthetics||The visual and artistic aspects of a game, including colors, character design, and environmental elements that contribute to the player's experience.
Ambient||Background sounds or music that help create the atmosphere of a game’s world and make spaces feel more alive.
Art||A domain of game making that involves the visual and audio components of a game, including character design, environmental assets, sound design, UI elements, and animations.
Assessment||Methods used to evaluate learners’ progress, including informal reflection and formal rubrics.
Asset (Game Asset)||Any visual, audio, or interactive element used in a game, such as characters, backgrounds, music, sound effects, or animations.
Backlog||A growing list of ideas to add, fix, or improve in a game, from must-haves to wish-list items.
Branch||A version of a project where changes can be made without affecting the main branch. Branches allow game makers to experiment or add features safely.
Cell shading||A visual style that uses bold outlines and flat colors to make 2D or pixel art stand out with a clear, high-contrast look.
Cloning||The process of creating a local copy of a repository from a remote server, such as GitHub.
Collaboration||The process of working together to design, create, and refine game projects, often involving feedback and playtesting.
Commit||A save point in Git that records the changes you selected. Commits create a history of your project that you can go back to if needed.
Compliment, Coach, and Encourage||A feedback approach that focuses on highlighting strengths, offering guidance for improvement, and motivating learners to keep progressing.
Contribution||A change, feature, or asset added to a shared project.
Constant||A value in programming that does not change while the game is running, often used for settings like speed or gravity.
Core Gameplay Loop||The repeated cycle of player actions, rewards, and challenges that keep the game engaging.
Creative Agency||The ability of learners to take ownership of their projects and make independent creative decisions.
Decomposition (Problem Decomposition)||The process of breaking down complex game design tasks into smaller, manageable parts.
Deliverables||Tangible outcomes expected from learners, such as a playable game and a game pitch presentation.
Diversity & Inclusivity||Ensuring that games represent and are accessible to players from a variety of backgrounds and experiences.
Domain||A specific area of expertise within game development that focuses on a distinct aspect of the creation process (Engineering, Marketing, Game Design, Art, and Management and Production).
Engagement||The level of involvement and interaction learners have with the game-making process.
Engineering||A domain of game making that involves the technical aspects of game development, including programming, physics simulation, and system architecture using the Godot engine.
Experiential Learning||Learning through hands-on activities, exploration, and iteration rather than passive instruction.
Feedback||Constructive critique provided by peers, instructors, or mentors to help refine game designs.
Feature Branch||A branch created to work on a specific feature or change in a project. It can later be merged back into the main branch after review.
Fork||A copy of a repository created under your own GitHub account, allowing you to make changes freely without affecting the original project.
Frame Drops||Games are made up of many images, called frames, shown very quickly to create motion. Frame drops happen when the game can’t show these images fast enough, causing movement to look choppy or stutter. This can make the game feel less smooth or harder to control.
Function||A reusable block of code that performs a specific task, such as moving a player or playing a sound.
Future-Ready Skills||Essential competencies such as problem-solving, collaboration, and adaptability that prepare learners for careers in and beyond game development.
Game||An interactive experience designed to engage players through challenges, choices, and feedback, often providing entertainment, education, or storytelling.
Game Design||A domain of game making that involves the creative process of designing gameplay mechanics, player interactions, level structures, and overall game flow.
Game Design Document (GDD)||A structured outline that details the concept, mechanics, story, and visuals of a game.
Game Design Journal||A personal record where game makers capture ideas, plans, reflections, and progress throughout the design process.
Game Engine||A software framework used to develop video games, providing essential tools for rendering graphics, handling physics, scripting gameplay mechanics, and managing assets.
Game Elements||The basic building blocks of a game, such as rules, goals, challenges, mechanics, and space.
Game Maker||A learner or creator engaged in designing, developing, and refining video games, applying principles of game design, mechanics, storytelling, and user experience.
Gameplay Mechanics||The rules and actions that define how players interact with the game world, such as jumping, collecting, or solving puzzles.
Game Systems||The interconnected rules, mechanics, and processes that make a game function, such as scoring, health, physics, or inventory. Together, they shape how the game responds to the player’s actions.
Git||A version control system used to track changes in code, manage different project versions, and collaborate with others (eg, GitHub).
Git Bash (Terminal/Command Line)||A text-based interface where Git commands are typed to interact with a repository, such as creating branches or committing changes.
Git Command||An instruction typed into the terminal to tell Git what to do, such as git status to see the state of your project.
Glitch||An unexpected error or bug in a game that causes it to behave in ways the designer didn’t intend.
Go-To-Market||A domain of game making that involves the strategies for launching a game, including audience research, marketing, distribution, and community engagement.
Godot Engine||A free and open-source game engine used for designing and developing games in the Core: Godot program.
Grayboxing||A level design method where simple shapes and placeholder objects are used to plan a game’s layout and gameplay before adding final art or details.
Immersion||The feeling of being deeply involved in a game world, often created through visuals, sound, story, and smooth gameplay.
Iteration||The process of refining a game through repeated cycles of prototyping, playtesting, and feedback.
Lag||A delay between a player’s input and the game’s response, often caused by network or performance issues.
Learner Outcomes||The knowledge and skills learners are expected to gain by completing the program, such as understanding game mechanics and creating a playable game.
Level||A distinct section of a game, designed with specific challenges, objectives, and environments.
Level Design||The process of designing and structuring the spaces within a game, ensuring progression, challenges, and engagement.
Level Design Document||A plan that outlines a level’s layout, goals, mechanics, and flow before it is built in the game engine.
Local Repository||The version of a Git project stored on your own computer, where you make and save changes before sharing them online.
Management & Production||A domain of game making that involves the process of organizing and leading a game development project, including teamwork, workflow management, and iterative development.
Main Branch||The central branch of a project that represents the official version of the game. Finished and reviewed changes from feature branches are merged here.
Mechanics||The rules and systems that define how a game functions and how players interact with it.
Mentors||Industry professionals who provide guidance, insights, and feedback to learners throughout the game-making process.
Merge||The process of integrating changes from one branch into another in an open-source project.
Merge Conflict||When branches are merged, Git attempts to combine their changes into a single branch. Conflicts may arise if the changes affect the same parts of a file, requiring manual resolution before the merge can be completed.
Moodboard||A collection of pictures, colors, and words that show how a video game idea should look and feel.
Modding||Modifying an existing game to experiment with game mechanics, aesthetics, and player experiences.
Narrative||In video games is the story of the game. It tells who the characters are, what is happening, and why the player goes on the adventure.
Open Source||Software with a publicly accessible source code that can be freely used, modified, and shared by anyone, often developed collaboratively by a community of contributors.
Optimization||The process of improving how efficiently a game runs by reducing lag, shortening load times, and making assets or code perform better.
Pedagogy (Play, Create, Share, Reflect)||The learning approach used in our programs, emphasizing hands-on creation, collaboration, and iterative improvement.
Pitch||A short presentation of a game idea used to share its concept, goals, and appeal with others.
Pixel Art||A digital art style where images are created with visible square pixels, often used in retro or stylized games.
Platformer||A type of game where players jump, run, and navigate across platforms or obstacles, often focusing on timing, precision, and movement through levels.
Player||An individual who interacts with a game, engaging with its mechanics, challenges, and narrative to achieve objectives or explore its world.
Player Character or PC||The character you control in a game. It’s the one you move, jump, and use to play the game.
Playtest||The process of testing a game with players to gather feedback and improve gameplay.
Problem Decomposition||The process of breaking down complex game design tasks into smaller, manageable parts.
Prototyping||Creating an early version of a game to explore mechanics and test ideas before finalizing the design.
Pull (Git)||The action of bringing the latest commits from a remote repository (like GitHub) into your local repository to update your project.
Pull Request (PR)||A request to merge changes from one branch or fork into another. Pull requests let others review, discuss, and approve your changes before they become part of the main project.
Push (Git)||The action of sending your commits from your local repository to a remote repository (like GitHub) so that others can see your changes.
Remote Repository||The version of a Git project stored online (for example, on GitHub) that allows you to back up your work and collaborate with others.
Repository||A project folder tracked by Git that contains all of the files, history, and branches for a game or program.
Scaffolding||Providing structured support to help learners develop skills progressively before working independently.
Scope||The overall size and complexity of a game project, including how much content, art, and gameplay it will include. Managing scope helps keep a project realistic and achievable.
Session Structure||The organization of each learning session, including essential questions, activities, and assessments.
Side Quests||Supplementary learning activities that allow learners to explore specific topics in game design at their own pace.
Skill Tree||A visual system that shows how a player’s abilities or powers can grow and branch over time. Unlocking new skills often depends on choices or progress made earlier in the game.
Spawner||A node or script in a game that automatically creates or “spawns” objects, enemies, or items at certain times or locations.
Sprite||A 2D image or animation used to represent a character, object, or other visual element in a game.
Sprite frames||The individual images that make up a sprite’s animation sequence, shown in order to create movement.
Staging||The step in Git where you pick and choose which files or changes to prepare for the next commit, like selecting which edits in your game you want to save.
Storyboard||A sequence of drawings or panels that show how the player will experience key moments, actions, or cutscenes in the game.
Stuttering||Brief pauses or uneven motion in a game caused by performance issues, often related to frame drops or loading.
Systems Thinking||Understanding how different elements in a game interact and influence each other.
Technical Skills||Skills related to coding, using game engines, designing UI, and implementing sound and animations in a game.
TileMap||A grid-based system in Godot used for designing and organizing game environments.
Untracked Files||Files that exist in your game project but are not yet being tracked by Git. Git only saves them once you add and commit them.
User Experience (UX)||The overall feel and accessibility of a game from the player’s perspective.
User Interface (UI)||The visual elements of a game, such as menus, buttons, and HUDs, that allow players to interact with the game.
Version Control System (VCS)||A tool that tracks changes to files and projects over time, letting multiple people collaborate and return to earlier versions if needed.`;

Aprendizaje experiencial||Un enfoque de aprendizaje basado en la práctica, la exploración y la iteración, en lugar de la instrucción pasiva.
Archivos no rastreados (Untracked Files)||Archivos que existen en un proyecto de juego pero que aún no están siendo rastreados por Git. Git solo los guarda una vez que se agregan y se confirman (commit).
Área (Dominio/Domain)||Un área específica de especialización dentro del desarrollo de videojuegos que se centra en un aspecto particular del proceso de creación (Ingeniería, Marketing, Diseño de videojuegos, Arte y Gestión y Producción).
Arte||Un área del desarrollo de videojuegos que abarca los componentes visuales y sonoros de un juego, incluyendo el diseño de personajes, los recursos de los escenarios, el diseño de sonido, los elementos de la interfaz de usuario (UI) y las animaciones.
Asset (Game Asset)||Cualquier elemento visual, sonoro o interactivo utilizado en un juego, como personajes, fondos, música, efectos de sonido o animaciones.
Autonomía Creativa||La capacidad de los participantes para asumir la responsabilidad de sus proyectos y tomar decisiones creativas de forma independiente.
Backlog (lista de pendientes)||Una lista creciente de ideas para agregar, corregir o mejorar en un juego, desde lo imprescindible hasta lo deseable.
Caída de FPS (Caída de fotogramas / Frame Drops)||Los videojuegos están compuestos por muchas imágenes, llamadas fotogramas, que se muestran rápidamente para crear la ilusión de movimiento. Las caídas de fotogramas ocurren cuando el juego no puede mostrarlos con la velocidad suficiente, lo que provoca que el movimiento se vea entrecortado o presente tirones. Esto puede hacer que el juego se perciba menos fluido o sea más difícil de controlar.
Cell shading||Un estilo visual que utiliza contornos marcados y colores planos para dar a los gráficos 2D o pixel art una apariencia definida y de alto contraste.
Clonación||El proceso de crear una copia local de un repositorio a partir de un repositorio remoto, como uno alojado en GitHub.
Colaboración||El proceso de trabajar en conjunto para diseñar, crear y perfeccionar proyectos de videojuegos, generalmente mediante la retroalimentación y las pruebas de juego.
Comando de Git||Una instrucción que se escribe en la terminal para indicarle a Git qué acción realizar, como git status, que muestra el estado del proyecto.
Commit (Confirmación de Cambios)||Un punto de guardado en Git que registra los cambios seleccionados. Los commits crean un historial del proyecto al que se puede volver cuando sea necesario.
Contribución||Un cambio, una funcionalidad o un recurso agregado a un proyecto compartido.
Constante||Un valor en programación que no cambia mientras el juego está en ejecución y que suele utilizarse para configuraciones como la velocidad o la gravedad.
Core Gameplay Loop (Bucle Principal del Juego)||El ciclo repetitivo de acciones, recompensas y desafíos que mantiene el interés del jugador durante la experiencia de juego.
Creador de videojuegos (Game Maker)||Un estudiante o creador que diseña, desarrolla y perfecciona videojuegos, aplicando principios de diseño de juegos, mecánicas, narrativa y experiencia de usuario.
Descomposición de problemas||El proceso de dividir tareas complejas de diseño de juegos en partes más pequeñas y manejables.
Diario de diseño de videojuegos||Un registro personal en el que los creadores de videojuegos documentan ideas, planes, reflexiones y avances a lo largo del proceso de diseño.
Diseño de niveles||El proceso de diseñar y estructurar los espacios dentro de un juego, asegurando la progresión, los desafíos y el nivel de interés del jugador.
Diseño de videojuegos||Un área del desarrollo de videojuegos que abarca el proceso creativo de diseñar mecánicas de juego, interacciones del jugador, estructuras de niveles y el flujo general del juego.
Diversidad e inclusión||Garantizar que los videojuegos representen y sean accesibles para jugadores de diversos orígenes, contextos y experiencias.
Documento de diseño de nivel||Un documento que describe la disposición, los objetivos, las mecánicas y el flujo de un nivel antes de su implementación en el motor de juego.
Documento de diseño de videojuegos (GDD)||Un documento estructurado que detalla el concepto, las mecánicas, la historia y los aspectos visuales de un juego.
Engagement||El nivel de involucramiento e interacción que los estudiantes tienen con el proceso de desarrollo de videojuegos.
Entregables||Productos o resultados concretos que se espera que los estudiantes entreguen, como un videojuego jugable y una presentación (pitch) del juego.
Elementos del juego||Los componentes básicos de un juego, como las reglas, los objetivos, los desafíos, las mecánicas y el espacio de juego.
Elogia, sugiere y anima||Un enfoque de retroalimentación que consiste en elogiar los aspectos positivos del trabajo, sugerir oportunidades de mejora y animar a los estudiantes a continuar desarrollando sus habilidades.
Estética||Los aspectos visuales y artísticos de un juego, incluyendo los colores, el diseño de personajes y los elementos del entorno que contribuyen a la experiencia del jugador.
Estructura de la sesión||La organización de cada sesión de aprendizaje, incluyendo preguntas esenciales, actividades y evaluaciones.
Evaluación||Los métodos utilizados para evaluar el progreso de los estudiantes, incluyendo reflexiones informales y rúbricas de evaluación.
Experiencia de usuario (UX)||La sensación general y el nivel de accesibilidad de un juego desde la perspectiva del jugador.
Feature Branch (Rama de Funcionalidad)||Una rama creada para trabajar en una característica o cambio específico de un proyecto. Después de ser revisada, puede fusionarse nuevamente con la rama principal.
Fork||Una copia de un repositorio creada en una cuenta propia de GitHub, que permite realizar cambios libremente sin afectar el proyecto original.
Función||Un bloque de código reutilizable que realiza una tarea específica, como mover a un jugador o reproducir un sonido.
Future-Ready Skills (Habilidades para el Futuro)||Competencias esenciales, como la resolución de problemas, la colaboración y la adaptabilidad, que preparan a los estudiantes para desarrollarse profesionalmente dentro y fuera de la industria del desarrollo de videojuegos.
Gestión y Producción||Un área del desarrollo de videojuegos que implica la organización y dirección de un proyecto de desarrollo, incluyendo el trabajo en equipo, la gestión de flujos de trabajo y el desarrollo iterativo.
Git||Un sistema de control de versiones utilizado para registrar cambios en el código, gestionar diferentes versiones de un proyecto y colaborar con otras personas (por ejemplo, mediante GitHub).
Git Bash (terminal/línea de comandos)||Una interfaz basada en texto en la que se escriben comandos de Git para interactuar con un repositorio, como crear ramas o realizar commits.
Glitch||Un error o fallo inesperado en un juego que hace que se comporte de una manera no prevista por quienes lo diseñaron.
Godot Engine||Un motor de desarrollo de videojuegos gratuito y de código abierto utilizado para diseñar y desarrollar juegos en el programa Core: Godot.
Grayboxing||Un método de diseño de niveles en el que se utilizan formas simples y objetos provisionales para planificar la distribución y la jugabilidad de un nivel antes de incorporar el arte y los detalles finales.
Habilidades||Las acciones o poderes que un personaje puede utilizar en un juego, como saltar, realizar un desplazamiento rápido (dash) o lanzar un hechizo. Las habilidades suelen definir las opciones del jugador y pueden desarrollarse o cambiar mediante Skill Trees o mejoras.
Habilidades técnicas||Habilidades relacionadas con la programación, el uso de motores de juego, el diseño de interfaz de usuario (UI) y la implementación de sonido y animaciones en un juego.
Ingeniería||Un área del desarrollo de videojuegos que abarca los aspectos técnicos de la creación de juegos, incluyendo la programación, la simulación de física y la arquitectura de sistemas utilizando el motor Godot.
Inmersión||La sensación de estar profundamente involucrado en el mundo de un juego, generada por elementos como los gráficos, el sonido, la narrativa y una jugabilidad fluida.
Interfaz de usuario (UI)||Los elementos visuales de un juego, como menús, botones y HUDs, que permiten a los jugadores interactuar con el juego.
Iteración||El proceso de mejorar y perfeccionar un juego mediante ciclos repetidos de prototipado, pruebas de juego y retroalimentación.
Juego||Una experiencia interactiva diseñada para involucrar a los jugadores mediante desafíos, decisiones y retroalimentación, ofreciendo entretenimiento, aprendizaje o narración de historias.
Jugador||Una persona que interactúa con un juego, involucrándose con sus mecánicas, desafíos y narrativa para alcanzar objetivos o explorar su mundo.
Lag||Un retraso entre la acción del jugador y la respuesta del juego, a menudo causado por problemas de red o de rendimiento.
Main Branch (Rama Principal)||La rama principal de un proyecto que representa la versión oficial del juego. Los cambios finalizados y revisados desde ramas de funcionalidad (feature branches) se integran aquí.
Mecánicas||Las reglas y sistemas que definen cómo funciona un juego y cómo interactúan los jugadores con él.
Mecánicas de juego||Las reglas y acciones que definen cómo los jugadores interactúan con el mundo del juego, como saltar, recolectar objetos o resolver acertijos.
Mentores||Profesionales de la industria que brindan orientación, conocimientos y retroalimentación a los estudiantes a lo largo del proceso de desarrollo de juegos.
Merge (fusión)||El proceso de integrar cambios de una rama en otra dentro de un proyecto de código abierto.
Merge Conflict (Conflicto de fusión)||Cuando se fusionan ramas, Git intenta combinar sus cambios en una sola rama. Pueden surgir conflictos si los cambios afectan las mismas partes de un archivo, lo que requiere una resolución manual antes de completar la fusión.
Misiones secundarias||Actividades de aprendizaje complementarias que permiten a los estudiantes explorar temas específicos del diseño de juegos a su propio ritmo.
Moodboard (tablero de inspiración)||Una colección de imágenes, colores y palabras que muestran cómo debería verse y sentirse una idea de videojuego.
Modificación (Mod)||El proceso de modificar un juego existente para experimentar con mecánicas, estética y experiencias del jugador.
Motor de juego||Un entorno de desarrollo de software utilizado para crear videojuegos, que proporciona herramientas esenciales para renderizar gráficos, gestionar la física, programar mecánicas de juego y administrar recursos.
Narrativa||En los videojuegos, es la historia del juego. Define quiénes son los personajes, qué está sucediendo y por qué el jugador emprende la aventura.
Nivel||Una sección definida de un juego, diseñada con desafíos, objetivos y entornos específicos.
Open Source (Código abierto)||Software cuyo código fuente es accesible públicamente y puede ser utilizado, modificado y compartido libremente por cualquier persona, generalmente desarrollado de forma colaborativa por una comunidad de contribuyentes.
Optimización||El proceso de mejorar la eficiencia con la que funciona un juego, reduciendo la latencia, acortando los tiempos de carga y haciendo que los recursos o el código tengan un mejor rendimiento.
Pedagogía de Endless Access (Jugar, Crear, Compartir, Reflexionar)||El enfoque de aprendizaje utilizado en nuestros programas, que enfatiza la creación a partir de la práctica, la colaboración y la mejora iterativa.
Pensamiento sistémico||La comprensión de cómo los diferentes elementos de un juego interactúan entre sí y se influyen mutuamente.
Pitch (Presentación breve)||Una presentación corta de una idea de videojuego utilizada para comunicar su concepto, objetivos y atractivo a otras personas.
Pixel Art||Un estilo de arte digital en el que las imágenes se crean con píxeles cuadrados visibles, comúnmente utilizado en juegos retro o estilizados.
Plataformero o Juego de Plataformas||Un tipo de juego en el que los jugadores saltan, corren y se desplazan a través de plataformas u obstáculos, con un enfoque frecuente en el tiempo, la precisión y el movimiento a lo largo de niveles.
Personaje del jugador o PC||El personaje que controlas en un juego. Es el que movés, hacés saltar y usás para jugar.
Playtest (Prueba de juego)||El proceso de probar un juego con jugadores para recopilar retroalimentación y mejorar la jugabilidad.
Prototipado||La creación de una versión temprana de un juego para explorar mecánicas y probar ideas antes de finalizar el diseño.
Pull (Hacer Pull)||La acción de traer los commits más recientes desde un repositorio remoto (como GitHub) a tu repositorio local para actualizar tu proyecto.
Pull Request o PR||Una solicitud para fusionar cambios de una rama o fork en otra. Las pull requests permiten que otras personas revisen, discutan y aprueben tus cambios antes de que pasen a formar parte del proyecto principal.
Push (Hacer Push)||La acción de enviar tus commits desde tu repositorio local a un repositorio remoto (como GitHub) para que otras personas puedan ver tus cambios.
Rama (Branch)||Una versión de un proyecto en la que se pueden realizar cambios sin afectar la rama principal. Las ramas permiten desarrollar nuevas funcionalidades o experimentar de forma segura.
Repositorio local||La versión de un proyecto de Git almacenada en un equipo local, donde se realizan y guardan cambios antes de compartirlos en línea.
Repositorio remoto||La versión de un proyecto de Git almacenada en línea (por ejemplo, en GitHub) que permite respaldar tu trabajo y colaborar con otras personas.
Repositorio||Una carpeta de proyecto gestionada por Git que contiene todos los archivos, el historial y las ramas de un juego o programa.
Resultados de aprendizaje||Los conocimientos y habilidades que se espera que los estudiantes adquieran al completar el programa, como comprender las mecánicas de juego y crear un juego jugable.
Retroalimentación||Comentarios y observaciones constructivas proporcionados por compañeros, instructores o mentores para ayudar a mejorar el diseño de un videojuego.
Salida al mercado||Un área del desarrollo de videojuegos que abarca las estrategias para lanzar un juego al mercado, incluyendo la investigación de la audiencia, el marketing, la distribución y la interacción con la comunidad.
Scope (Alcance)||El tamaño y la complejidad general de un proyecto de videojuego, incluyendo cuánto contenido, arte y jugabilidad tendrá. Gestionar el alcance ayuda a mantener el proyecto realista y alcanzable.
Sistema de control de versiones||Una herramienta que registra los cambios en archivos y proyectos a lo largo del tiempo, permitiendo que varias personas colaboren y que se pueda volver a versiones anteriores si es necesario.
Sistemas de juego||El conjunto de reglas, mecánicas y procesos interconectados que hacen funcionar un juego, como la puntuación, la salud, la física o el inventario. En conjunto, determinan cómo responde el juego a las acciones del jugador.
Skill Tree (Árbol de habilidades)||Un sistema visual que muestra cómo las habilidades o poderes de un jugador pueden crecer y ramificarse con el tiempo. Desbloquear nuevas habilidades suele depender de decisiones o avances logrados anteriormente en el juego.
Sonido ambiental||Los sonidos o la música de fondo que ayudan a crear la atmósfera del mundo del juego y hacen que los escenarios se sientan más vivos.
Spawner||Un nodo o script en un juego que crea automáticamente objetos, enemigos o ítems en determinados momentos o ubicaciones.
Sprite||Una imagen o animación en 2D utilizada para representar un personaje, objeto u otro elemento visual en un juego.
Sprite frames (Cuadros de Sprites)||Las imágenes individuales que componen la secuencia de animación de un sprite, mostradas en orden para crear movimiento.
Staging (Preparación de Cambios)||La etapa en Git en la que se seleccionan qué archivos o cambios preparar para el próximo commit.
Storyboard (Guión gráfico)||Una secuencia de dibujos o viñetas que muestran cómo el jugador experimentará momentos clave, acciones o escenas cinemáticas en el juego.
Stuttering (Tirones)||Pausas breves o movimiento irregular en un juego causados por problemas de rendimiento, a menudo relacionados con caídas de fotogramas o cargas.
TileMap||Un sistema basado en una grilla en Godot que se utiliza para diseñar y organizar entornos de juego.`;

const UI = {
  en: { eyebrow: "All programs", title: "Game Design Glossary",
        lede: "Shared vocabulary for game makers, facilitators, and mentors across our programs.",
        ph: "Search terms and definitions", terms: n => `${n} terms`, of: (a,b) => `${a} of ${b}`,
        empty: q => `No terms match <strong>“${q}”</strong>. Try a shorter word, or switch to Español.` },
  es: { eyebrow: "Todos los programas", title: "Glosario de Game Design",
        lede: "Vocabulario compartido para creadores de videojuegos, facilitadores y mentores de nuestros programas.",
        ph: "Buscar términos y definiciones", terms: n => `${n} términos`, of: (a,b) => `${a} de ${b}`,
        empty: q => `Ningún término coincide con <strong>«${q}»</strong>. Prueba con una palabra más corta o cambia a English.` }
};

const fold = s => Array.from(s).map(c => c.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().charAt(0) || c).join("");
function parse(raw, locale) {
  return raw.trim().split("\n").map(line => {
    const [t, d] = line.split("||");
    const m = t.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    return { term: m ? m[1] : t, alt: m ? m[2] : "", def: d.trim() };
  }).sort((a, b) => a.term.localeCompare(b.term, locale, { sensitivity: "base" }));
}
const DATA = { en: parse(EN, "en"), es: parse(ES, "es") };

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function hl(text, q) {
  if (!q) return esc(text);
  const f = fold(text); let out = "", i = 0, j;
  while ((j = f.indexOf(q, i)) !== -1) { out += esc(text.slice(i, j)) + "<mark>" + esc(text.slice(j, j + q.length)) + "</mark>"; i = j + q.length; }
  return out + esc(text.slice(i));
}
const codeify = html => html.replace(/\bgit status\b/g, "<code>git status</code>");

let lang = "en";
try { const s = localStorage.getItem("gd-glossary-lang"); if (s === "es" || s === "en") lang = s; } catch (e) {}
if (location.hash === "#es" || location.hash === "#en") lang = location.hash.slice(1);

const $ = id => document.getElementById(id);
function render() {
  const t = UI[lang], raw = $("q").value.trim(), q = fold(raw);
  document.documentElement.lang = lang;
  $("eyebrow").textContent = t.eyebrow; $("title").textContent = t.title; $("lede").textContent = t.lede;
  $("q").placeholder = t.ph;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  const all = DATA[lang];
  const hits = q ? all.filter(e => fold(e.term + " " + e.alt + " " + e.def).includes(q)) : all;
  $("count").textContent = q ? t.of(hits.length, all.length) : t.terms(all.length);

  const groups = new Map();
  hits.forEach(e => { const L = fold(e.term).charAt(0).toUpperCase(); if (!groups.has(L)) groups.set(L, []); groups.get(L).push(e); });

  $("letters").innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(L =>
    groups.has(L) ? `<a href="#${lang}" data-to="L-${L}" aria-label="${L}">${L}</a>` : `<span aria-hidden="true">${L}</span>`).join("");

  if (!hits.length) { $("list").innerHTML = `<p class="empty">${t.empty(esc(raw))}</p>`; return; }
  $("list").innerHTML = [...groups].map(([L, items]) => `
    <section class="group" id="L-${L}">
      <h2>${L}</h2>
      <dl>${items.map(e => `<div class="entry"><dt>${hl(e.term, q)}${e.alt ? `<span class="alt">(${hl(e.alt, q)})</span>` : ""}</dt><dd>${codeify(hl(e.def, q))}</dd></div>`).join("")}</dl>
    </section>`).join("");
}

$("letters").addEventListener("click", ev => {
  const a = ev.target.closest("a[data-to]"); if (!a) return;
  ev.preventDefault(); const el = document.getElementById(a.dataset.to); if (el) el.scrollIntoView();
});
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("gd-glossary-lang", lang); } catch (e) {}
  try { history.replaceState(null, "", "#" + lang); } catch (e) {}
  render();
}));
$("q").addEventListener("input", render);
window.addEventListener("hashchange", () => { if (location.hash === "#es" || location.hash === "#en") { lang = location.hash.slice(1); render(); } });
render();
</script>
