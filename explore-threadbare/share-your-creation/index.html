<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore: Threadbare &mdash; Share Your Creation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --accent:#ef6c45;
    --accent-dark:#d85a35;
    --ink:#25242b;
    --sub:#6b6874;
    --bg:#faf7f3;
    --card:#ffffff;
    --line:#ece7e0;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:36px 20px 60px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .kicker{
    font-size:13px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent-dark);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-variation-settings:"SOFT" 0, "WONK" 0;
    font-weight:600;
    font-size:clamp(30px,5vw,44px);
    line-height:1.05;
    margin:0 0 8px 0;
  }
  h1 .accent{
    font-style:italic;
    font-weight:600;
    color:var(--accent);
  }
  .subtitle{
    font-size:16px;
    color:var(--sub);
    max-width:540px;
  }
  .lang-toggle{
    display:flex;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
    gap:2px;
    flex-shrink:0;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .lang-toggle button{
    border:none;
    background:transparent;
    padding:8px 16px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    border-radius:999px;
    cursor:pointer;
    color:var(--sub);
    transition:all .15s ease;
  }
  .lang-toggle button.active{
    background:var(--ink);
    color:#fff;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .dots{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
  }
  .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#e3ddd3;
    border:none;
    cursor:pointer;
    padding:0;
    transition:all .2s ease;
  }
  .dot.active{
    background:var(--accent);
    width:26px;
    border-radius:6px;
  }
  .dot.done{
    background:#d8b8a8;
  }
  .step-counter{
    font-size:13px;
    color:var(--sub);
    font-weight:500;
    margin-left:auto;
    white-space:nowrap;
  }

  .controls-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .play-btn{
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:9px 18px 9px 14px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .play-btn:hover{ background:#403e47; }
  .play-btn svg{ width:14px; height:14px; flex-shrink:0; }
  .speed-group{
    display:flex;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
    gap:2px;
  }
  .speed-group button{
    border:none;
    background:transparent;
    padding:7px 13px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    border-radius:999px;
    cursor:pointer;
    color:var(--sub);
    transition:all .15s ease;
  }
  .speed-group button.active{
    background:#f0e6db;
    color:var(--accent-dark);
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 8px 30px rgba(60,40,20,.06);
  }
  .frame{
    width:100%;
    background:
      linear-gradient(135deg, #f4ede4 25%, transparent 25%) -10px 0,
      linear-gradient(225deg, #f4ede4 25%, transparent 25%) -10px 0,
      linear-gradient(315deg, #f4ede4 25%, transparent 25%),
      linear-gradient(45deg, #f4ede4 25%, transparent 25%);
    background-size:20px 20px;
    background-color:#fbf8f4;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    border-bottom:1px solid var(--line);
  }
  .img-wrap{
    position:relative;
    display:inline-block;
    line-height:0;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,.10);
  }
  .img-wrap img{
    display:block;
    max-width:100%;
    max-height:460px;
    width:auto;
  }
  .fallback-badge{
    position:absolute;
    left:10px;
    bottom:10px;
    z-index:5;
    display:inline-flex;
    align-items:center;
    background:rgba(37,36,43,.86);
    color:#fff;
    font-size:12px;
    font-weight:600;
    line-height:1.3;
    padding:6px 12px;
    border-radius:999px;
    max-width:calc(100% - 20px);
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .callout-label{
    position:absolute;
    transform:translateX(-50%);
    z-index:6;
    background:var(--accent);
    color:#fff;
    font-size:13px;
    font-weight:700;
    line-height:1.3;
    padding:7px 14px;
    border-radius:16px;
    max-width:min(320px, 90%);
    width:max-content;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.22);
    pointer-events:none;
  }
  .overlay-svg{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    pointer-events:none;
  }
  .ring{
    position:absolute;
    border:3px solid var(--accent);
    border-radius:10px;
    box-shadow:0 0 0 5px rgba(239,108,69,.28);
    pointer-events:none;
    animation:pulseRing 1.5s ease-in-out infinite;
  }
  @keyframes pulseRing{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.045); opacity:.68; }
  }
  .fake-cursor{
    position:absolute;
    width:30px;
    height:30px;
    pointer-events:none;
    transform-origin: 7px 4px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
    animation:cursorPulse 1.8s ease-in-out infinite;
  }
  @keyframes cursorPulse{
    0%,55%,100%{ transform:scale(1); }
    72%{ transform:scale(.86); }
    86%{ transform:scale(1.06); }
  }
  .type-cursor{
    animation:blinkCursor .9s step-start infinite;
  }
  @keyframes blinkCursor{
    50%{ opacity:0; }
  }

  .body-area{
    padding:26px 30px 30px;
  }
  .step-title{
    font-family:'Fraunces', serif;
    font-variation-settings:"SOFT" 0, "WONK" 0;
    font-weight:600;
    font-size:24px;
    margin:0 0 12px 0;
  }
  .step-body{
    font-size:16px;
    line-height:1.6;
    color:#3c3a42;
    margin:0;
  }
  .step-body strong{ color:var(--ink); }

  .note, .tip{
    margin-top:14px;
    padding:12px 16px;
    border-radius:12px;
    font-size:14.5px;
    line-height:1.5;
  }
  .note{
    background:#f4ede4;
    color:#6b5842;
    border-left:3px solid var(--accent);
  }
  .tip{
    background:#eef3f6;
    color:#3d5b6b;
    border-left:3px solid #6fa3bd;
  }

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
    gap:12px;
  }
  .nav-btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:13px 26px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:all .15s ease;
  }
  .nav-btn.primary{
    background:var(--accent);
    color:#fff;
  }
  .nav-btn.primary:hover{ background:var(--accent-dark); }
  .nav-btn.secondary{
    background:transparent;
    color:var(--sub);
    border:1px solid var(--line);
  }
  .nav-btn.secondary:hover{ background:#f2ede6; }
  .nav-btn:disabled{
    opacity:.35;
    cursor:default;
  }
  .nav-btn.primary:disabled:hover{ background:var(--accent); }

  .finish-banner{
    display:none;
    align-items:center;
    gap:12px;
    background:linear-gradient(135deg,#ef6c45,#f5a26b);
    color:#fff;
    padding:16px 22px;
    border-radius:14px;
    font-weight:600;
    margin-top:18px;
    font-size:15px;
  }
  .finish-banner.show{ display:flex; }
  .finish-banner .emoji{ font-size:22px; }

  @media (max-width:600px){
    .body-area{ padding:20px 18px 24px; }
    .frame{ padding:12px; }
    .nav-btn{ padding:12px 18px; font-size:14px; }
    .step-counter{ margin-left:0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="kicker" data-i18n="kicker">Explore: Threadbare</div>
      <h1><span data-i18n="title_a">Share Your </span><span class="accent" data-i18n="title_b">Creation</span></h1>
      <div class="subtitle" data-i18n="subtitle"></div>
    </div>
    <div class="lang-toggle">
      <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
      <button id="btn-es" onclick="setLang('es')">ES</button>
    </div>
  </header>

  <div class="progress-row">
    <div class="dots" id="dots"></div>
    <div class="step-counter" id="stepCounter"></div>
  </div>

  <div class="controls-row">
    <button class="play-btn" id="playBtn" onclick="togglePlay()">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      <span id="playLabel">Play</span>
    </button>
    <div class="speed-group" id="speedGroup">
      <button data-speed="6000" onclick="setSpeed(6000)" data-i18n="speed_slow">Slow</button>
      <button data-speed="4000" class="active" onclick="setSpeed(4000)" data-i18n="speed_normal">Normal</button>
      <button data-speed="2500" onclick="setSpeed(2500)" data-i18n="speed_fast">Fast</button>
    </div>
  </div>

  <div class="card">
    <div class="frame">
      <div class="img-wrap" id="imgWrap">
        <img id="stepImage" src="" alt="">
        <span id="fallbackBadge" class="fallback-badge" style="display:none;"></span>
      </div>
    </div>
    <div class="body-area">
      <h2 class="step-title" id="stepTitle"></h2>
      <p class="step-body" id="stepBody"></p>
      <div class="note" id="stepNote" style="display:none;"></div>
      <div class="tip" id="stepTip" style="display:none;"></div>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn secondary" id="prevBtn" onclick="manualGo(-1)" data-i18n="prev">Back</button>
    <button class="nav-btn primary" id="nextBtn" onclick="manualGo(1)" data-i18n="next">Next</button>
  </div>

  <div class="finish-banner" id="finishBanner">
    <span class="emoji">&#127881;</span>
    <span id="finishText"></span>
  </div>

</div>

<script>

ermina con algo que debes entregar. Desde cualquier parte de la página del programa, haz clic en <strong>Tareas</strong> en el menú superior para ver la lista completa.", "image": "step1"}, {"title": "Busca la tarea de hoy", "body": "Busca la tarea que corresponde al taller que acabas de terminar y haz clic en su nombre para abrirla.", "note": "Este ejemplo muestra una entrega de sonido &mdash; la tuya podría pedir un dibujo, un párrafo, un póster, o lo que sea que pidiera tu taller. Cada tarea se abre exactamente igual, sin importar qué estés entregando.", "image": "step2"}, {"title": "Haz clic en “Comenzar esta tarea”", "body": "La página de la tarea explica qué hacer y qué pregunta(s) responder. Léela y luego haz clic en <strong>Comenzar esta tarea</strong>, arriba a la derecha, para abrir el formulario de entrega.", "note": "Los pasos para entregar tu trabajo son los mismos en cada página de tarea. Lo único que cambia es la pregunta específica (o dos) al final, sobre esa entrega en particular.", "image": "step3"}, {"title": "Marca que está lista para entregar", "body": "En la pestaña <strong>Progreso</strong>, abre el menú <strong>Tipo de actualización</strong> y elige <strong>Enviar Para Completar</strong>. Así tu facilitador sabe que es tu trabajo terminado, no solo un avance.", "image": "step4"}, {"title": "Escribe tu respuesta", "body": "Usa el cuadro <strong>Descripción</strong> para responder la pregunta de reflexión de tu taller — esa pregunta viene de las diapositivas de tu taller, no de esta guía, así que será diferente cada vez.", "image": "write", "special": "typewriter"}, {"title": "Adjunta tu trabajo subiendo un archivo", "body": "Haz clic en el botón <strong>+</strong> debajo de <strong>Agregar archivos o enlaces</strong> — esa es la Opción 1, para un archivo guardado en tu computadora. Se abrirá una ventana de tu computadora; busca tu archivo y ábrelo.", "note": "Este ejemplo muestra cómo elegir un archivo de sonido &mdash; harías exactamente lo mismo para adjuntar una foto, un documento, un video, o lo que pida tu tarea.", "image": "step5", "special": "callout", "calloutKey": "option1_label"}, {"title": "O compártelo con un enlace", "body": "Si tu archivo está en línea en lugar de en tu computadora, haz clic en el ícono de enlace, pega el enlace para compartir y haz clic en <strong>Agregar</strong>.", "tip": "Consejo: sin importar cómo obtengas el enlace para compartir — desde Google Drive, OneDrive, Dropbox, o cualquier otro — aquí es donde lo pegas.", "image": "step6"}, {"title": "Haz clic en Enviar", "body": "Una vez que tu descripción y tu archivo (o enlace) estén listos, haz clic en el botón naranja <strong>Enviar</strong>, abajo a la derecha. Listo &mdash; tu tarea quedó entregada.", "image": "step7"}, {"title": "Revisa tu feed para confirmar", "body": "Regresa a <strong>Inicio</strong> y mira el Feed Principal &mdash; verás tu entrega publicada como una Actualización de Tarea con tu archivo adjunto. Si está ahí, ¡ya terminaste!", "image": "step8"}], "fallback_note": "Captura de pantalla en inglés — la versión en español está en camino.", "option1_label": "Opción 1 · Adjunta un archivo desde tu computadora"}};

const ES_FALLBACK_IMAGES = new Set([]);
const TARGETS = {"en": [{"left": 22.5, "top": 12, "width": 8.5, "height": 7}, {"left": 3, "top": 53, "width": 94, "height": 13.5}, {"left": 78, "top": 1.5, "width": 20, "height": 8}, null, null, {"left": 22.5, "top": 75.8, "width": 5.7, "height": 6.2}, {"left": 29.3, "top": 75.8, "width": 5.7, "height": 6.2}, {"left": 80, "top": 85, "width": 15.5, "height": 7}, null], "es": [{"left": 25, "top": 24.5, "width": 9, "height": 7}, {"left": 4.5, "top": 33, "width": 92.5, "height": 12.5}, {"left": 71.93, "top": 1.3, "width": 24.32, "height": 7}, {"left": 3.5, "top": 38.5, "width": 96, "height": 5.5}, null, {"left": 5, "top": 77, "width": 14, "height": 8.5}, {"left": 8.5, "top": 79, "width": 7, "height": 6}, {"left": 80.92, "top": 89, "width": 14.44, "height": 8}, null]};
const WRITE_IMG_SIZE = {"en": {"w": 1300, "h": 885}, "es": {"w": 1523, "h": 1605}};
const WRITE_PATCH = {"en": {"x": 95, "y": 678, "w": 570, "h": 48}, "es": {"x": 104, "y": 797, "w": 770, "h": 80}};
const WRITE_TEXT_POS = {"en": {"x": 105, "y": 712, "fontSize": 26}, "es": {"x": 112, "y": 845, "fontSize": 32}};

let lang = 'en';
let idx = 0;
let playing = false;
let speed = 4000;
let timer = null;
let typeTimer = null;
let activeTimeouts = [];

function steps(){ return CONTENT[lang].steps; }

function clearOverlay(){
  const wrap = document.getElementById('imgWrap');
  wrap.querySelectorAll('.ring, .overlay-svg, .fake-cursor, .click-burst, .callout-label').forEach(el => el.remove());
  clearInterval(typeTimer);
  activeTimeouts.forEach(t => clearTimeout(t));
  activeTimeouts = [];
}

function drawRing(){
  const t = TARGETS[lang][idx];
  if(!t) return;
  const wrap = document.getElementById('imgWrap');

  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.style.left = t.left + '%';
  ring.style.top = t.top + '%';
  ring.style.width = t.width + '%';
  ring.style.height = t.height + '%';
  wrap.appendChild(ring);

  // Static cursor, tip placed right at the target center so it reads as
  // actively clicking the button (no drift/movement — fixed in place).
  const cx = t.left + t.width/2;
  const cy = t.top + t.height/2;

  const cursor = document.createElement('div');
  cursor.className = 'fake-cursor';
  cursor.style.left = cx + '%';
  cursor.style.top = cy + '%';
  cursor.innerHTML = `<svg viewBox="0 0 24 24" width="30" height="30"><path d="M5 3l6.5 15.5 2-6.2L19.5 9.5z" fill="#ef6c45" stroke="white" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
  wrap.appendChild(cursor);
}

function drawCallout(labelText){
  // Same ring + cursor as drawRing, plus a short label bubble identifying
  // what the highlighted button means (e.g. "Option 1 · Attach a file").
  drawRing();
  const t = TARGETS[lang][idx];
  if(!t) return;
  const wrap = document.getElementById('imgWrap');

  const label = document.createElement('div');
  label.className = 'callout-label';
  const cx = t.left + t.width/2;
  // Anchor left/right instead of centering when close to an edge, so the
  // bubble never gets clipped by the image frame's overflow:hidden.
  if(cx < 28){
    label.style.left = '3%';
    label.style.transform = 'none';
    label.style.textAlign = 'left';
  } else if(cx > 72){
    label.style.right = '3%';
    label.style.transform = 'none';
    label.style.textAlign = 'right';
  } else {
    label.style.left = cx + '%';
    label.style.transform = 'translateX(-50%)';
  }
  // Place the bubble just above the target; flip below if too close to the top edge.
  const above = t.top > 12;
  if(above){
    label.style.bottom = (100 - t.top) + '%';
    label.style.marginBottom = '10px';
  } else {
    label.style.top = (t.top + t.height) + '%';
    label.style.marginTop = '10px';
  }
  label.textContent = labelText;
  wrap.appendChild(label);
}

function drawTypewriter(){
  const wc=WRITE_IMG_SIZE[lang], wp=WRITE_PATCH[lang], wt=WRITE_TEXT_POS[lang];
  const wrap = document.getElementById('imgWrap');
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'overlay-svg');
  svg.setAttribute('viewBox', `0 0 ${wc.w} ${wc.h}`);
  svg.setAttribute('preserveAspectRatio', 'none');

  const patch = document.createElementNS(svgNS, 'rect');
  patch.setAttribute('x', wp.x);
  patch.setAttribute('y', wp.y);
  patch.setAttribute('width', wp.w);
  patch.setAttribute('height', wp.h);
  patch.setAttribute('fill', '#ffffff');
  svg.appendChild(patch);

  const text = document.createElementNS(svgNS, 'text');
  text.setAttribute('x', wt.x);
  text.setAttribute('y', wt.y);
  text.setAttribute('font-family', "'Inter', Arial, sans-serif");
  text.setAttribute('font-size', wt.fontSize);
  text.setAttribute('fill', '#33313a');
  const tspan = document.createElementNS(svgNS, 'tspan');
  tspan.setAttribute('id', 'typedSpan');
  text.appendChild(tspan);
  const cursor = document.createElementNS(svgNS, 'tspan');
  cursor.setAttribute('class', 'type-cursor');
  cursor.textContent = '|';
  text.appendChild(cursor);
  svg.appendChild(text);

  wrap.appendChild(svg);

  const full = CONTENT[lang].type_text;
  let i = 0;
  clearInterval(typeTimer);
  tspan.textContent = '';
  typeTimer = setInterval(()=>{
    if(i <= full.length){
      tspan.textContent = full.slice(0, i);
      i++;
    } else {
      clearInterval(typeTimer);
      typeTimer = setTimeout(()=>{
        i = 0;
        tspan.textContent = '';
        typeTimer = setInterval(()=>{
          if(i <= full.length){
            tspan.textContent = full.slice(0, i);
            i++;
          } else {
            clearInterval(typeTimer);
          }
        }, 45);
      }, 1800);
    }
  }, 45);
}

function render(){
  const c = CONTENT[lang];
  const s = steps()[idx];

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(c[key] !== undefined) el.innerHTML = c[key];
  });
  document.getElementById('playLabel').textContent = playing ? c.pause : c.play;

  document.getElementById('stepImage').src = IMAGES[lang][s.image];
  document.getElementById('stepImage').alt = s.title;
  document.getElementById('stepTitle').innerHTML = s.title;
  document.getElementById('stepBody').innerHTML = s.body;

  const badgeEl = document.getElementById('fallbackBadge');
  badgeEl.style.display = 'none';

  clearOverlay();
  if(s.special === 'typewriter'){
    drawTypewriter();
  } else if(s.special === 'callout'){
    drawCallout(c[s.calloutKey] || '');
  } else {
    drawRing();
  }

  const noteEl = document.getElementById('stepNote');
  if(s.note){ noteEl.style.display='block'; noteEl.innerHTML = s.note; }
  else { noteEl.style.display='none'; }

  const tipEl = document.getElementById('stepTip');
  if(s.tip){
    tipEl.style.display='block';
    tipEl.innerHTML = s.tip;
  } else {
    tipEl.style.display='none';
  }

  document.getElementById('stepCounter').textContent = `${c.step_label} ${idx+1} ${c.of} ${steps().length}`;

  const dotsWrap = document.getElementById('dots');
  dotsWrap.innerHTML = '';
  steps().forEach((_, i)=>{
    const d = document.createElement('button');
    d.className = 'dot' + (i===idx?' active':'') + (i<idx?' done':'');
    d.onclick = ()=>{ stopPlay(); idx=i; render(); };
    dotsWrap.appendChild(d);
  });

  document.getElementById('prevBtn').disabled = (idx===0);
  const nextBtn = document.getElementById('nextBtn');
  const finishBanner = document.getElementById('finishBanner');
  if(idx === steps().length-1){
    nextBtn.style.display='none';
    finishBanner.classList.add('show');
    document.getElementById('finishText').textContent = c.done;
    stopPlay();
  } else {
    nextBtn.style.display='inline-block';
    finishBanner.classList.remove('show');
  }

  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.getElementById('btn-es').classList.toggle('active', lang==='es');
  document.documentElement.lang = lang;
}

function go(delta){
  const next = idx + delta;
  if(next < 0 || next > steps().length-1) return false;
  idx = next;
  render();
  return true;
}

function manualGo(delta){
  stopPlay();
  go(delta);
}

function setLang(l){
  stopPlay();
  lang = l;
  render();
}

function togglePlay(){
  if(playing){ stopPlay(); } else { startPlay(); }
}

function startPlay(){
  if(idx === steps().length-1){ idx = 0; }
  playing = true;
  document.getElementById('playIcon').style.display='none';
  document.getElementById('pauseIcon').style.display='inline';
  document.getElementById('playLabel').textContent = CONTENT[lang].pause;
  render();
  scheduleTick();
}

function stopPlay(){
  playing = false;
  clearTimeout(timer);
  document.getElementById('playIcon').style.display='inline';
  document.getElementById('pauseIcon').style.display='none';
  document.getElementById('playLabel').textContent = CONTENT[lang].play;
}

function scheduleTick(){
  clearTimeout(timer);
  if(!playing) return;
  timer = setTimeout(()=>{
    if(!playing) return;
    const moved = go(1);
    if(!moved){ stopPlay(); return; }
    scheduleTick();
  }, speed);
}

function setSpeed(ms){
  speed = ms;
  document.querySelectorAll('#speedGroup button').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.speed)===ms);
  });
  if(playing){ scheduleTick(); }
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') manualGo(1);
  if(e.key === 'ArrowLeft') manualGo(-1);
  if(e.key === ' '){ e.preventDefault(); togglePlay(); }
});

render();
</script>
